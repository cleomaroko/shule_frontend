server {
    listen 80;
    server_name _;

    # Files are copied to /usr/share/nginx/html/dira so URLs under /dira/
    # match Vite's production `base` without rewriting on the host nginx.
    location /dira/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /dira/index.html;
    }
}
