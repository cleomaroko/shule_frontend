services:
  shule-frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_BASE_PATH: /
        VITE_APP_NAME: Dira
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY}
        VITE_GOOGLE_APP_ID: ${VITE_GOOGLE_APP_ID}
    image: shule-frontend:latest
    container_name: shule-frontend
    restart: always
    ports:
      - "127.0.0.1:8082:80"
