services:
  shule-frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_BASE_PATH: /
        VITE_APP_NAME: "Dira 365"
        VITE_GOOGLE_DRIVE_UPLOAD_URL: ${VITE_GOOGLE_DRIVE_UPLOAD_URL:-}
    image: shule-frontend:latest
    container_name: shule-frontend
    restart: always
    ports:
      - "127.0.0.1:8082:80"
