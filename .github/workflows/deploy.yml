name: Deploy Dira frontend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack sources for the VPS
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' -czf "$RUNNER_TEMP/shule-frontend.tgz" .
          mv "$RUNNER_TEMP/shule-frontend.tgz" shule-frontend.tgz

      - name: Copy archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: shule-frontend.tgz
          target: "~/Java/shule_frontend"
          overwrite: true

      - name: Build and start frontend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          command_timeout: 20m
          script_stop: true
          script: |
            mkdir -p ~/Java/shule_frontend
            cd ~/Java/shule_frontend
            tar -xzf shule-frontend.tgz
            rm -f shule-frontend.tgz
            printf '%s\n' \
              "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
              "VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}" \
              "VITE_GOOGLE_APP_ID=${{ secrets.VITE_GOOGLE_APP_ID }}" \
              > .env
            echo "${{ secrets.PASSWORD }}" | sudo -S -p '' docker compose up -d --build
            echo "${{ secrets.PASSWORD }}" | sudo -S -p '' docker image prune -f
