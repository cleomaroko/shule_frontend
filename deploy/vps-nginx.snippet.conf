# Add this block to /etc/nginx/sites-enabled/vps-config INSIDE the existing
# server { ... } that listens on 80 for 162.35.96.90.
# Do not change location /, /ws-shule/, /crash/, or /ws/.
#
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# App URL: http://162.35.96.90/dira/

    # SHULE FRONTEND (Dira)
    location /dira/ {
        proxy_pass http://127.0.0.1:8082/dira/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
