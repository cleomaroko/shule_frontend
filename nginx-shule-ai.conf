# HTTPS on dira365.com cannot let the browser call http://162.35.96.90
# (mixed content). The SPA calls same-origin:
#   GET /api/shule-ai/chat?message=...
#
# Include this on the dira365.com server, *before* a generic `location /api`.
# It forwards to the same Java route as:
#   http://162.35.96.90/api/shule-ai/chat?message=...
#
# Timeouts are 310s so nginx outlasts Spring/Ollama (`timeout=300s`).

location /api/shule-ai/ {
    proxy_pass http://localhost:8080/api/shule-ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 310s;
    proxy_send_timeout    310s;
    proxy_read_timeout    310s;
    send_timeout          310s;
}
